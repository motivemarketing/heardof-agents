<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#0B0B0C">
<title>Heard Of for Agents</title>
<meta name="description" content="The Heard Of app for real estate agents: Heard Of Score, Local Leader Report, Brand Anatomy, City Content Plan, scripts and the Conversion Kit.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: the Signal Room shell. A glass sidebar on the left (pillars as nav groups, a selection pill that glides between items), a glass top bar, and one view at a time that arrives with a staggered rise. Heard Of's orange sits in the brand slot; everything else is the Signal Room legend: green and red only for numbers, warm neutrals, Playfair for titles and big numbers, Inter for everything else. */
:root{
  --brand:#FF4A2B; --brand-ink:#FF6B52; --brand-2:#5BBFD8; --on-brand:#0b0b0c;
  --up:#3FC98A; --up-ink:#5FD6A0; --down:#F05D6C; --down-ink:#F58190; --watch:#F0C04A; --watch-ink:#F3CC6B;
  --dated:#63C6DE; --dated-ink:#7FD2E6;
  --bg:#0b0b0c; --bg-raised:#151517; --bg-elevated:#1c1c20; --bg-input:#0f0f11;
  --ink:#f5f1e8; --ink-soft:#c9c4b8; --muted:#908a7e; --placeholder:#6b665d;
  --line:#2a2a2e; --line-soft:#1f1f23; --line-hover:#3a3a40;
  --veil:rgba(255,255,255,.018); --veil-strong:rgba(255,255,255,.045);
  --glass:color-mix(in srgb, #0b0b0c 70%, transparent); --glass-deep:color-mix(in srgb, #0b0b0c 82%, transparent);
  --glass-edge:rgba(255,255,255,.07); --glass-blur:saturate(150%) blur(14px);
  --shade:rgba(0,0,0,.8);
  --e1:0 1px 2px -1px rgba(0,0,0,.5),0 2px 8px -4px rgba(0,0,0,.4);
  --e2:0 2px 4px -2px rgba(0,0,0,.55),0 10px 26px -12px rgba(0,0,0,.5);
  --e3:0 4px 10px -4px rgba(0,0,0,.6),0 28px 64px -24px rgba(0,0,0,.62);
  --rim:inset 0 1px 0 rgba(255,255,255,.055);
  --rim-strong:inset 0 1px 0 rgba(255,255,255,.085),inset 0 -1px 0 rgba(0,0,0,.25);
  --glow-1:color-mix(in srgb, #FF4A2B 10%, transparent); --glow-2:color-mix(in srgb, #5BBFD8 7%, transparent);
  --doc:#f7f3ea; --doc-ink:#1b1a18; --doc-muted:#676259; --doc-line:#ddd3bf;
  --r-sm:10px; --r-md:14px; --r-lg:20px; --r-xl:26px; --r-pill:99px; --sidebar-w:248px;
  --ease:cubic-bezier(.4,0,.2,1); --ease-glide:cubic-bezier(.32,.72,0,1);
  --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; --serif:'Playfair Display',Georgia,serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --brand:#F2401F; --brand-ink:color-mix(in srgb,#F2401F 62%,#2b1a12); --on-brand:#0b0b0c;
  --up:#13804f; --up-ink:#0a6b42; --down:#C32F43; --down-ink:#B32640; --watch:#A8780A; --watch-ink:#745107; --dated:#1f7f97; --dated-ink:#17657a;
  --bg:#f7f3ea; --bg-raised:#ffffff; --bg-elevated:#eae3d3; --bg-input:#ffffff;
  --ink:#1b1a18; --ink-soft:#44403a; --muted:#676259; --placeholder:#968e81;
  --line:#cdbfa4; --line-soft:#e4dbca; --line-hover:#b3a488;
  --veil:rgba(27,26,24,.035); --veil-strong:rgba(27,26,24,.07);
  --glass:rgba(247,243,234,.82); --glass-deep:rgba(247,243,234,.93); --glass-edge:rgba(255,255,255,1);
  --shade:rgba(54,46,34,.34);
  --e1:0 1px 2px -1px rgba(54,46,34,.17),0 2px 8px -4px rgba(54,46,34,.14);
  --e2:0 2px 5px -2px rgba(54,46,34,.16),0 12px 28px -14px rgba(54,46,34,.24);
  --e3:0 6px 14px -6px rgba(54,46,34,.2),0 30px 68px -26px rgba(54,46,34,.34);
  --rim:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(54,46,34,.07);
  --rim-strong:inset 0 1px 0 rgba(255,255,255,1),inset 0 -1px 0 rgba(54,46,34,.13);
  --glow-1:color-mix(in srgb,#F2401F 7%,transparent); --glow-2:color-mix(in srgb,#5BBFD8 6%,transparent);
  --doc:#fffdf8; --doc-line:#e4dbca;
  color-scheme:light;
}}
:root[data-theme="light"]{
  --brand:#F2401F; --brand-ink:color-mix(in srgb,#F2401F 62%,#2b1a12); --on-brand:#0b0b0c;
  --up:#13804f; --up-ink:#0a6b42; --down:#C32F43; --down-ink:#B32640; --watch:#A8780A; --watch-ink:#745107; --dated:#1f7f97; --dated-ink:#17657a;
  --bg:#f7f3ea; --bg-raised:#ffffff; --bg-elevated:#eae3d3; --bg-input:#ffffff;
  --ink:#1b1a18; --ink-soft:#44403a; --muted:#676259; --placeholder:#968e81;
  --line:#cdbfa4; --line-soft:#e4dbca; --line-hover:#b3a488;
  --veil:rgba(27,26,24,.035); --veil-strong:rgba(27,26,24,.07);
  --glass:rgba(247,243,234,.82); --glass-deep:rgba(247,243,234,.93); --glass-edge:rgba(255,255,255,1);
  --shade:rgba(54,46,34,.34);
  --e1:0 1px 2px -1px rgba(54,46,34,.17),0 2px 8px -4px rgba(54,46,34,.14);
  --e2:0 2px 5px -2px rgba(54,46,34,.16),0 12px 28px -14px rgba(54,46,34,.24);
  --e3:0 6px 14px -6px rgba(54,46,34,.2),0 30px 68px -26px rgba(54,46,34,.34);
  --rim:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(54,46,34,.07);
  --rim-strong:inset 0 1px 0 rgba(255,255,255,1),inset 0 -1px 0 rgba(54,46,34,.13);
  --glow-1:color-mix(in srgb,#F2401F 7%,transparent); --glow-2:color-mix(in srgb,#5BBFD8 6%,transparent);
  --doc:#fffdf8; --doc-line:#e4dbca;
  color-scheme:light;
}
:root[data-theme="dark"]{ color-scheme:dark; }
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background-color .4s var(--ease),color .4s var(--ease)}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 80% 50% at 50% -8%,var(--glow-1),transparent 60%),radial-gradient(ellipse 60% 40% at 88% 8%,var(--glow-2),transparent 60%)}
::selection{background:color-mix(in srgb,var(--brand) 30%,transparent)}
:focus-visible{outline:2px solid var(--brand-ink);outline-offset:2px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font-family:inherit;color:inherit}
.label{font:700 10px/1.4 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.sig{color:var(--brand-ink)}
.acc{font-family:var(--serif);font-style:italic;font-weight:600;letter-spacing:-.01em;color:var(--brand-ink)}
.muted{color:var(--muted)}
.hint{font-size:12.5px;color:var(--muted);line-height:1.5}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px;border:3px solid var(--bg)}

/* ── shell ── */
.shell{position:relative;z-index:1;display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);min-height:100vh;min-height:100dvh}
.sidebar{position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;display:flex;flex-direction:column;gap:18px;padding:24px 0 16px;
  padding-left:env(safe-area-inset-left,0px);
  border-right:1px solid var(--line-soft);background:linear-gradient(180deg,var(--veil),transparent),var(--glass);
  -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);box-shadow:inset -1px 0 0 var(--glass-edge),10px 0 40px -24px var(--shade);z-index:20}
.sb-brand{padding:0 22px}
.sb-brand .mk{display:inline-flex;align-items:center;gap:9px;font:700 10.5px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--brand-ink)}
.sb-brand .mk i{width:6px;height:6px;border-radius:50%;background:var(--brand);box-shadow:0 0 10px var(--brand);animation:pulse 2.8s var(--ease) infinite}
@keyframes pulse{50%{box-shadow:0 0 2px var(--brand);opacity:.7}}
.sb-brand .nm{font:700 22px/1.1 var(--serif);letter-spacing:-.01em;margin-top:8px}
.sb-brand .nm b{color:var(--brand-ink);font-weight:700}
.me{margin:0 14px;display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--bg-raised);box-shadow:var(--rim),var(--e1);cursor:pointer;text-align:left;width:calc(100% - 28px);transition:border-color .2s var(--ease),transform .2s var(--ease)}
.me:hover{border-color:var(--line-hover)}
.me:active{transform:scale(.985)}
.av{flex:none;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 85%,#fff),var(--brand));color:var(--on-brand);font:700 13px/1 var(--serif);box-shadow:0 0 0 2px var(--bg-raised),0 0 0 3px color-mix(in srgb,var(--brand) 45%,transparent)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.me .av{width:36px;height:36px}
.me .who{min-width:0;flex:1}
.me .who strong{display:block;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .who span{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navwrap{position:relative;flex:1;padding:0 12px}
.navwrap::before{content:"";position:absolute;z-index:0;pointer-events:none;left:0;top:0;width:var(--gw,0);height:var(--gh,0);opacity:var(--go,0);
  transform:translate3d(var(--gx,0),var(--gy,0),0);border-radius:var(--r-sm);
  background:linear-gradient(180deg,color-mix(in srgb,var(--brand) 20%,transparent),color-mix(in srgb,var(--brand) 9%,transparent));
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--brand) 26%,transparent),inset 0 1px 0 color-mix(in srgb,var(--brand) 34%,transparent),0 4px 14px -6px color-mix(in srgb,var(--brand) 45%,transparent);
  transition:transform .42s var(--ease-glide),height .24s var(--ease),width .24s var(--ease),opacity .2s}
.navwrap::after{content:"";position:absolute;z-index:1;pointer-events:none;left:0;top:0;width:2.5px;height:calc(var(--gh,0px) - 18px);opacity:var(--go,0);
  transform:translate3d(var(--gx,0),calc(var(--gy,0px) + 9px),0);border-radius:0 3px 3px 0;background:var(--brand);box-shadow:0 0 12px color-mix(in srgb,var(--brand) 70%,transparent);
  transition:transform .42s var(--ease-glide),height .24s var(--ease)}
.navwrap.now::before,.navwrap.now::after{transition:none}
.ng+.ng{margin-top:18px}
.ng .gl{font:700 9.5px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);padding:0 12px;margin-bottom:8px;display:block}
.nav-item{all:unset;box-sizing:border-box;position:relative;z-index:2;width:100%;display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r-sm);font-size:13.5px;font-weight:500;color:var(--ink-soft);cursor:pointer;transition:color .18s var(--ease),background-color .18s var(--ease),transform .18s var(--ease)}
.nav-item:hover{background:var(--veil-strong);color:var(--ink)}
.nav-item.on{color:var(--brand-ink);font-weight:600;background:none}
.nav-item:active{transform:scale(.985)}
.nav-item:focus-visible{outline:2px solid var(--brand-ink);outline-offset:-2px}
.nav-item svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav-item .dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--line);flex:none;transition:background-color .3s,box-shadow .3s}
.nav-item .dot.done{background:var(--up);box-shadow:0 0 8px color-mix(in srgb,var(--up) 60%,transparent)}
.sb-foot{margin:0 12px;padding-top:14px;border-top:1px solid var(--line-soft);display:flex;flex-direction:column;gap:10px}
.tiercard{border:1px solid var(--line);border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:8px;background:linear-gradient(160deg,color-mix(in srgb,var(--brand) 10%,var(--bg-raised)),var(--bg-raised) 55%);box-shadow:var(--rim)}
.tiercard strong{font:700 15px/1.25 var(--serif)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:14px;height:64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:env(safe-area-inset-top,0px);box-sizing:content-box;
  border-bottom:1px solid var(--line-soft);background:var(--glass-deep);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);box-shadow:inset 0 1px 0 var(--glass-edge),0 10px 30px -22px var(--shade)}
@media(min-width:900px){.topbar{padding-left:34px;padding-right:34px}}
.tb-title{display:flex;flex-direction:column;min-width:0}
.tb-title .label{font-size:9.5px}
.tb-title strong{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.iconbtn{all:unset;box-sizing:border-box;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--ink-soft);border:1px solid var(--line);background:var(--bg-raised);box-shadow:var(--rim);transition:color .2s,border-color .2s,transform .2s var(--ease)}
.iconbtn:hover{color:var(--ink);border-color:var(--line-hover)}
.iconbtn:active{transform:scale(.94)}
.iconbtn:focus-visible{outline:2px solid var(--brand-ink);outline-offset:2px}
.iconbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.menubtn{display:none}
.daypill{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--bg-raised);font-size:12px;font-weight:600;color:var(--ink-soft);box-shadow:var(--rim);white-space:nowrap}
.daypill i{width:6px;height:6px;border-radius:50%;background:var(--brand)}
.tb-av{width:34px;height:34px;cursor:pointer;border:0;padding:0}
.scrim{position:fixed;inset:0;z-index:18;background:rgba(6,6,7,.6);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
@media(max-width:899px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:min(84vw,300px);transform:translateX(-104%);transition:transform .42s var(--ease-glide);padding-top:calc(24px + env(safe-area-inset-top,0px))}
  body.menu-open .sidebar{transform:none}
  body.menu-open .scrim{opacity:1;pointer-events:auto}
  .menubtn{display:grid}
  .daypill{display:none}
}
main{padding:28px max(16px,env(safe-area-inset-right,0px)) 72px max(16px,env(safe-area-inset-left,0px));min-width:0}
@media(min-width:900px){main{padding:40px 48px 96px}}

/* ── views: arrive, don't appear ── */
.view{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.view>*{animation:rise .62s var(--ease-glide) both}
.view>*:nth-child(2){animation-delay:.05s}.view>*:nth-child(3){animation-delay:.1s}.view>*:nth-child(4){animation-delay:.15s}.view>*:nth-child(5){animation-delay:.2s}.view>*:nth-child(n+6){animation-delay:.25s}
.view.leaving{opacity:0;transform:translateY(-6px);transition:opacity .16s var(--ease),transform .16s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.vhead{display:flex;flex-direction:column;gap:10px;padding-bottom:4px}
.vhead h1{font:700 clamp(30px,4.2vw,46px)/1.05 var(--serif);letter-spacing:-.015em}
.vhead h1 .acc{font-weight:600}
.vhead p{color:var(--ink-soft);max-width:64ch;font-size:15.5px}
.banner{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border:1px solid color-mix(in srgb,var(--brand) 40%,var(--line));border-radius:var(--r-md);padding:13px 16px;background:linear-gradient(90deg,color-mix(in srgb,var(--brand) 9%,var(--bg-raised)),var(--bg-raised));box-shadow:var(--rim)}
.banner p{color:var(--ink-soft);font-size:13.5px;flex:1;min-width:220px}
.banner strong{color:var(--ink)}
.grid2{display:grid;gap:18px}
@media(min-width:780px){.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.grid3{display:grid;gap:18px}
@media(min-width:780px){.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{position:relative;background:var(--bg-raised);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0;box-shadow:var(--rim),var(--e2);transition:border-color .25s var(--ease),transform .35s var(--ease-glide),box-shadow .35s var(--ease)}
.card h2{font:700 24px/1.15 var(--serif);letter-spacing:-.01em}
.card h3{font:700 19px/1.25 var(--serif)}
.paper{background:var(--doc);color:var(--doc-ink);border-color:var(--doc-line);box-shadow:var(--rim-strong),var(--e3)}
.paper .label{color:var(--doc-muted)}
.paper .muted,.paper .hint{color:var(--doc-muted)}
.paper .acc{color:color-mix(in srgb,var(--brand) 62%,#2b1a12)}
.btn{appearance:none;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--r-pill);padding:12px 20px;font:600 14px/1 var(--sans);text-decoration:none;transition:background-color .2s var(--ease),color .2s,box-shadow .25s var(--ease),transform .2s var(--ease)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.55;cursor:progress}
.btn-sig{background:var(--brand);color:var(--on-brand);box-shadow:0 8px 24px -10px color-mix(in srgb,var(--brand) 70%,transparent),inset 0 1px 0 rgba(255,255,255,.25)}
.btn-sig:hover{box-shadow:0 12px 30px -10px color-mix(in srgb,var(--brand) 85%,transparent),inset 0 1px 0 rgba(255,255,255,.3);transform:translateY(-1px)}
.btn-ghost{background:var(--bg-elevated);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line),var(--rim)}
.btn-ghost:hover{box-shadow:inset 0 0 0 1px var(--line-hover),var(--rim)}
.paper .btn-ghost{background:transparent;color:var(--doc-ink);box-shadow:inset 0 0 0 1px var(--doc-line)}
.paper .btn-ghost:hover{box-shadow:inset 0 0 0 1px var(--doc-muted)}
.btn-sm{padding:8px 13px;font-size:12.5px}
.linkbtn{all:unset;cursor:pointer;color:var(--dated-ink);text-decoration:underline;text-underline-offset:3px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field label{font:700 10.5px/1.3 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.paper .field label{color:var(--doc-muted)}
input[type=text],input[type=number],input[type=url],select,textarea{width:100%;background:var(--bg-input);color:var(--ink);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;font:400 14.5px/1.4 var(--sans);transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand-ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
input::placeholder,textarea::placeholder{color:var(--placeholder)}
.big{font:700 clamp(54px,8vw,86px)/.9 var(--serif);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.big small{font:600 .24em/1 var(--sans);color:var(--muted);letter-spacing:0;margin-left:4px}
.big+.hint{display:block;margin-top:10px}
.grid2{align-items:start}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 11.5px/1 var(--sans);padding:6px 10px;border-radius:var(--r-pill);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.bad{background:color-mix(in srgb,var(--down) 14%,transparent);color:var(--down-ink)}
.pill.good{background:color-mix(in srgb,var(--up) 14%,transparent);color:var(--up-ink)}

.bars{display:flex;flex-direction:column}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;padding:13px 0;border-top:1px solid var(--line-soft);align-items:center}
.bar:first-child{border-top:0}
.bar strong{font-weight:600;font-size:14px}
.track{grid-column:1/-1;position:relative;height:22px;display:block}
.track .rail2{position:absolute;left:0;right:0;top:9px;height:4px;border-radius:2px;background:var(--line-soft)}
.track .you{position:absolute;left:0;top:7px;height:8px;border-radius:4px;background:linear-gradient(90deg,color-mix(in srgb,var(--brand) 70%,var(--bg)),var(--brand));width:0;transition:width 1.1s var(--ease-glide);box-shadow:0 0 12px -2px color-mix(in srgb,var(--brand) 60%,transparent)}
.ready .track .you{width:var(--w)}
.track .mk{position:absolute;top:2px;width:2px;height:18px;background:var(--ink);border-radius:1px}
.paper .track .rail2{background:var(--doc-line)}
.paper .track .mk{background:var(--doc-ink)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--bg-raised);box-shadow:var(--rim)}
table{border-collapse:collapse;width:100%;min-width:980px;font-size:13.5px}
td:nth-child(1),td:nth-child(2){min-width:150px}
td:last-child{min-width:170px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:middle}
th{font:700 9.5px/1.2 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);background:var(--bg-elevated)}
td input,td select{padding:8px 9px;font-size:13.5px}
tr:last-child td{border-bottom:0}
.weeks{display:flex;flex-direction:column;gap:14px}
.week{border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--bg-raised);box-shadow:var(--rim),var(--e1)}
.week>header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line-soft)}
.week>header strong{font:700 16px/1 var(--serif)}
.posts{display:grid;gap:1px;background:var(--line-soft)}
@media(min-width:780px){.posts{grid-template-columns:repeat(3,minmax(0,1fr))}}
.post{background:var(--bg-raised);padding:15px 16px;display:flex;flex-direction:column;gap:8px;min-width:0;transition:opacity .35s var(--ease),background-color .25s}
.post:hover{background:color-mix(in srgb,var(--bg-raised) 85%,var(--bg-elevated))}
.post h4{font-weight:600;font-size:14.5px;line-height:1.4}
.post p{font-size:13px;color:var(--ink-soft)}
.post.done{opacity:.6}
.post.done h4{text-decoration:line-through;text-decoration-color:var(--brand)}
.tick{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);cursor:pointer}
.tick input{accent-color:var(--brand);width:16px;height:16px}
.tabs{position:relative;display:inline-flex;gap:4px;padding:4px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--bg-raised);box-shadow:var(--rim);align-self:flex-start;max-width:100%;overflow-x:auto}
.tab{all:unset;cursor:pointer;padding:8px 15px;border-radius:var(--r-pill);font:600 13px/1 var(--sans);color:var(--ink-soft);transition:background-color .3s var(--ease-glide),color .2s;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--brand);color:var(--on-brand);box-shadow:0 6px 16px -8px color-mix(in srgb,var(--brand) 70%,transparent)}
.tab:focus-visible{outline:2px solid var(--brand-ink)}
.script{display:flex;flex-direction:column;gap:10px}
.script .beat{display:grid;grid-template-columns:70px minmax(0,1fr);gap:10px;font-size:14px;line-height:1.5}
.script .beat span:first-child{font:700 9.5px/22px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--doc-muted)}
.bio{font:500 15px/1.5 var(--sans);white-space:pre-line}
.count{font:600 11.5px/1 var(--sans);color:var(--doc-muted);font-variant-numeric:tabular-nums}
.count.over{color:var(--down-ink)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:44px;height:44px;border-radius:12px;border:1px solid rgba(0,0,0,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.qr{background:#fff;padding:12px;border-radius:14px;width:max-content;max-width:100%;box-shadow:var(--e2)}
.qr img,.qr canvas{display:block;max-width:100%}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:var(--r-pill);font:600 13.5px/1 var(--sans);z-index:60;box-shadow:var(--e3);animation:toastIn .45s var(--ease-glide)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}}
.q{display:flex;flex-direction:column;gap:8px;padding:15px 0;border-top:1px solid var(--line-soft)}
.q:first-child{border-top:0}
.q legend{font-weight:600;font-size:15px;padding:0;margin-bottom:4px}
fieldset{border:0;margin:0;padding:0;min-width:0}
.opts{display:grid;gap:7px}
@media(min-width:780px){.opts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.opt{position:relative;display:block}
.opt input{position:absolute;opacity:0;inset:0;margin:0}
.opt span{display:block;padding:11px 13px;border-radius:var(--r-sm);background:var(--bg-input);border:1px solid var(--line);font-size:13.5px;color:var(--ink-soft);cursor:pointer;transition:border-color .2s,background-color .2s,color .2s}
.opt span:hover{border-color:var(--line-hover)}
.opt input:checked+span{border-color:var(--brand-ink);color:var(--ink);background:color-mix(in srgb,var(--brand) 10%,var(--bg-input));box-shadow:inset 0 0 0 1px var(--brand-ink)}
.opt input:focus-visible+span{outline:2px solid var(--brand-ink);outline-offset:2px}
.photo{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.photo .av{width:96px;height:96px;font-size:34px}
.photo input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.celebrate{position:fixed;inset:0;pointer-events:none;z-index:70}
.shell.bare{grid-template-columns:minmax(0,1fr)}.shell.bare .sidebar,.shell.bare .topbar,.shell.bare .scrim{display:none}
.shell.bare main{width:100%;max-width:680px;margin:10vh auto 0}
.view.still>*{animation:none}
.photo label.btn:focus-within{outline:2px solid var(--brand-ink);outline-offset:2px}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .ready .track .you,.track .you{width:var(--w)}
  .chart .draw{stroke-dashoffset:0}.chart .fade{opacity:1}
}
</style>

<script>
(function(){
"use strict";
/* ================= Config ================= */
var CONFIG = {
  coachingBookingUrl: "https://calendly.com/zac-theryanleakgroup/30min", // TODO: Heard Of 1:1 coaching calendar
  upgradeUrl: "#upgrade",                                              // TODO: GHL upgrade order form
  storeKey: "heardof-agent-v1"
};
var BENCH = {
  small:{clarity:80,consistency:70,local:85,trust:82,conversion:68,reach:55},
  mid:{clarity:85,consistency:78,local:82,trust:85,conversion:75,reach:66},
  metro:{clarity:88,consistency:85,local:80,trust:88,conversion:80,reach:78}
};
var CATS = [
 {id:"clarity",name:"Clarity",weight:15,q:[["bio","If a stranger read your bio, would they know who you help, where, and why to follow you?",["Not really","They’d know I’m an agent","Yes: who and where","Yes, plus a reason to follow"]],["lane","Do you own a lane?",["I help anyone, anywhere","Loosely, a few areas","One clear area or client type","I’m known as the go-to for it"]]]},
 {id:"consistency",name:"Consistency",weight:20,q:[["freq","How often do you post?",["Rarely","About once a week","2–3 times a week","4 or more times a week"]],["video","How much of it is video with your face in it?",["None","A little","About half","Most of it"]],["plan","How do you make content?",["Whenever I remember","Week to week","From a monthly calendar","I batch-film ahead"]]]},
 {id:"local",name:"Local authority",weight:20,q:[["area","How often do you post about the area itself?",["Never","Once in a while","A few times a month","Every week"]],["data","How often do you explain the local market in plain language?",["Never","Once or twice a year","Quarterly","Monthly or more"]],["biz","Do you feature local businesses and people?",["Never","Rarely","Sometimes","It’s a regular series"]]]},
 {id:"trust",name:"Trust and proof",weight:15,q:[["reviews","How many Google reviews do you have?",["Under 10","10–24","25–74","75 or more"]],["stories","Do you post client stories after closings?",["Never","Sometimes","After most closings","Every closing, often on video"]]]},
 {id:"conversion",name:"Conversion",weight:20,q:[["link","Where does your link in bio go?",["Nowhere","My brokerage profile","My own website","A free guide or home-value offer"]],["dm","When someone messages you about a home, how fast do you reply?",["A day or more","Same day","Within an hour","Minutes, every time"]],["sphere","How often does your sphere hear from you by email or text?",["Almost never","A few times a year","Monthly","Every week or two"]]]},
 {id:"reach",name:"Reach",weight:10,q:[["followers","Roughly how many local followers do you have?",["Under 500","500–2,000","2,000–10,000","10,000+"]],["boost","Do you put money behind your best posts?",["Never","Tried it once","Now and then","Every week, a small budget"]]]}
];

/* ================= State ================= */
function sample(){
  return {
    sample:true, tier:"coaching", startDate:"2026-11-02",
    profile:{name:"Dana Rivera", city:"Scottsdale", state:"AZ", marketSize:"metro", handle:"@danasellsscottsdale"},
    scores:[
      {day:1, date:"2026-11-02", answers:{bio:1,lane:1,freq:1,video:1,plan:0,area:1,data:0,biz:0,reviews:2,stories:1,link:1,dm:2,sphere:1,followers:1,boost:0}},
      {day:30, date:"2026-12-02", answers:{bio:3,lane:2,freq:2,video:2,plan:2,area:2,data:1,biz:1,reviews:2,stories:1,link:2,dm:2,sphere:1,followers:1,boost:1}}
    ],
    anatomy:{who:"first-time buyers", where:"North Scottsdale", promise:"win without overpaying", known:"Explaining the market without the jargon", soul:"Fake urgency and bait-and-switch listings", p1:"Market minutes", p2:"North Scottsdale living", p3:"First-time buyer wins", voice:"Calm, straight, encouraging", c1:"#1f3a5f", c2:"#e8d9c0", look:"Natural light, outdoors, real neighborhoods", done:true},
    leaders:{rows:[
      {name:"You", handle:"@danasellsscottsdale", followers:1450, posts:4, video:30, reviews:22, rating:4.9, link:"brokerage"},
      {name:"Leader 1", handle:"@leaderone", followers:12400, posts:14, video:80, reviews:186, rating:4.9, link:"guide"},
      {name:"Leader 2", handle:"@leadertwo", followers:6800, posts:12, video:70, reviews:94, rating:5.0, link:"website"},
      {name:"Leader 3", handle:"@leaderthree", followers:3900, posts:10, video:60, reviews:61, rating:4.8, link:"guide"}
    ], done:true},
    plan:{done:{"0-0":true,"0-1":true,"0-2":true,"1-0":true,"1-1":true}},
    shots:{done:{0:true,1:true,2:true}},
    convert:{reviewUrl:"https://g.page/r/your-review-link", done:false}
  };
}
function blank(){
  return {sample:false, tier:"toolkit", startDate:new Date().toISOString().slice(0,10),
    profile:{name:"",city:"",state:"",marketSize:"mid",handle:""},
    scores:[], anatomy:{done:false}, leaders:{rows:[
      {name:"You",handle:"",followers:"",posts:"",video:"",reviews:"",rating:"",link:"brokerage"},
      {name:"",handle:"",followers:"",posts:"",video:"",reviews:"",rating:"",link:"website"},
      {name:"",handle:"",followers:"",posts:"",video:"",reviews:"",rating:"",link:"website"},
      {name:"",handle:"",followers:"",posts:"",video:"",reviews:"",rating:"",link:"website"}], done:false},
    plan:{done:{}}, shots:{done:{}}, convert:{reviewUrl:"",done:false}};
}
var S, MODE="demo", JOBS={}, SPOTS={}, loginMsg="";
/* MODE: "demo" (preview, saves in this browser), "login" (signed out), "server" (signed in at agents.ryanleak.com) */
try{ var raw=localStorage.getItem(CONFIG.storeKey); S = raw ? JSON.parse(raw) : sample(); }catch(e){ S = sample(); }
var saveT;
function save(){
  paintDots();
  if(MODE==="server"){ clearTimeout(saveT); saveT=setTimeout(pushState,600); return; }
  try{ localStorage.setItem(CONFIG.storeKey, JSON.stringify(S)); }catch(e){}
}
function own(){ var o={}; ["scores","anatomy","leaders","plan","shots","convert","photo"].forEach(function(k){o[k]=S[k]}); return o; }
function api(path,opts){
  opts=opts||{};
  return fetch(path,{method:opts.method||"GET",credentials:"same-origin",headers:opts.body?{"content-type":"application/json"}:{},body:opts.body?JSON.stringify(opts.body):undefined})
    .then(function(r){ return r.json().catch(function(){return {ok:false,error:"Unexpected response"}}).then(function(j){ j._status=r.status; return j; }); });
}
function pushState(){ api("/api/state",{method:"PUT",body:{state:own()}}).then(function(r){ if(!r.ok) toast("Couldn’t save. Check your connection."); }).catch(function(){ toast("Couldn’t save. Check your connection."); }); }
function progress(p){ if(MODE==="server") api("/api/progress",{method:"POST",body:p}).catch(function(){}); }
function auto(){ return S.auto||{}; }
function auditA(){ return auto().audit||null; }
function emptyRow(){ return {name:"",handle:"",followers:"",posts:"",video:"",reviews:"",rating:"",link:"website"}; }
function youRow(){
  var a=auditA(), s=a?a.signals:{};
  return {name:"You",handle:S.profile.handle||"",followers:a?s.followers:"",posts:a?s.posts30:"",video:a?s.videoPct:"",reviews:a?s.reviews:"",rating:a&&s.rating?s.rating:"",link:a?s.linkType:"brokerage"};
}
function applyAuto(){
  var a=auditA(), L=auto().leaders;
  if(a && a.place && !S.convert.reviewUrl) S.convert.reviewUrl=a.place.reviewUrl;
  if(S.leaders.source!=="manual"){
    if(L && L.leaders && L.leaders.length){
      S.leaders.rows=[youRow()].concat(L.leaders.map(function(l){return {name:l.name,handle:l.handle,followers:l.followers,posts:l.posts30,video:l.videoPct,reviews:l.reviews,rating:l.rating,link:l.linkType}}));
      while(S.leaders.rows.length<4) S.leaders.rows.push(emptyRow());
      S.leaders.source="auto"; S.leaders.done=true;
    } else if(a){ S.leaders.rows[0]=youRow(); }
  }
  autoPosts();
}
/* Posts detected on Instagram count toward the Content Plan, three per program week. */
function autoPosts(){
  var w0=auto().weekly, dates=(w0&&w0.postDates)||(auditA()&&auditA().postDates)||[], start=new Date(S.startDate+"T00:00:00").getTime(), per={};
  dates.forEach(function(d){ var t=Date.parse(d); if(!isFinite(t)||t<start) return; var w=Math.floor((t-start)/(7*864e5)); if(w<12) per[w]=(per[w]||0)+1; });
  S.plan.auto={}; Object.keys(per).forEach(function(w){ for(var j=0;j<Math.min(3,per[w]);j++) S.plan.auto[w+"-"+j]=true; });
}
function isPosted(k){ return !!(S.plan.done[k]||(S.plan.auto&&S.plan.auto[k])); }
function fromServer(me){
  var st=me.state||{}, m=me.member, b=blank();
  S={sample:false, tier:m.tier, startDate:m.startDate,
     profile:{name:(m.firstName+" "+m.lastName).trim(), city:m.city, state:m.region, marketSize:m.marketSize, handle:m.handle?"@"+m.handle:"", businessName:m.businessName, email:m.email},
     scores:st.scores||[], anatomy:st.anatomy||{done:false}, leaders:st.leaders||b.leaders, plan:st.plan||{done:{}}, shots:st.shots||{done:{}},
     convert:st.convert||{reviewUrl:"",done:false}, auto:st.auto||{}, photo:typeof st.photo==="string"&&st.photo.indexOf("data:image/")===0?st.photo:""};
  if(!S.plan.done) S.plan.done={};
  JOBS=me.jobs||{};
  applyAuto();
}
function jobsRunning(){ return ["audit","leaders"].filter(function(k){ return JOBS[k] && (JOBS[k].status==="queued"||JOBS[k].status==="running"); }); }
function watchJobs(){
  if(MODE!=="server") return;
  var run=jobsRunning(); if(!run.length) return;
  clearTimeout(watchJobs._t);
  watchJobs._t=setTimeout(function(){
    Promise.all(run.map(function(k){ return api("/api/job?id="+JOBS[k].id).then(function(r){ if(r.ok) JOBS[k]={id:JOBS[k].id,status:r.status,error:r.error}; }); }))
      .then(function(){
        if(jobsRunning().length<run.length) return api("/api/me").then(function(me){ if(me.ok){ S.auto=(me.state&&me.state.auto)||{}; applyAuto(); render(); } });
      })
      .catch(function(){})
      .then(watchJobs);
  },3000);
}
function startJob(kind){
  api("/api/refresh",{method:"POST",body:{kind:kind}}).then(function(r){
    if(!r.ok){ toast(r.error||"Couldn’t start"); return; }
    JOBS[kind]={id:r.job,status:"queued"}; render(); watchJobs();
  });
}
function loadSpots(){ if(MODE!=="server") return; api("/api/spots").then(function(r){ if(r.ok){ SPOTS=r.spots||{}; if(view==="plan"||view==="home") render(); } }).catch(function(){}); }
var view = "home";

/* ================= Helpers ================= */
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
function city(){ return S.profile.city || "your city"; }
function who(){ return (S.anatomy && S.anatomy.who) || "buyers and sellers"; }
function where(){ return (S.anatomy && S.anatomy.where) || city(); }
function T(str){ return esc(str).split("{city}").join(esc(city())).split("{who}").join(esc(who())).split("{where}").join(esc(where())); }
function toast(msg){ var t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(function(){t.hidden=true},1800); }
function copy(text){
  var done=function(){toast("Copied")};
  try{ navigator.clipboard.writeText(text).then(done,function(){fallback(text)}); }catch(e){ fallback(text); }
}

function chart(){
  var pts=S.scores.map(function(s){return {d:s.day, v:score(s.answers).you}}), lead=score(S.scores[0].answers).lead;
  var W=520,H=150,pl=34,pr=16,pt=14,pb=26, days=[1,30,60,90];
  function x(d){return pl+(d-1)/89*(W-pl-pr)} function y(v){return pt+(100-v)/100*(H-pt-pb)}
  var g=''; [0,50,100].forEach(function(v){ g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(pl-8)+'" y="'+(y(v)+4)+'" text-anchor="end">'+v+'</text>'; });
  days.forEach(function(d){ g+='<text x="'+x(d)+'" y="'+(H-6)+'" text-anchor="middle">Day '+d+'</text>'; });
  g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(lead)+'" y2="'+y(lead)+'" stroke="var(--leader)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="'+(W-pr)+'" y="'+(y(lead)-6)+'" text-anchor="end">Leaders '+lead+'</text>';
  var path=pts.map(function(p,i){return (i?"L":"M")+x(p.d)+" "+y(p.v)}).join(" ");
  var area=pts.length>1?'<path d="'+path+' L'+x(pts[pts.length-1].d)+' '+y(0)+' L'+x(pts[0].d)+' '+y(0)+' Z" fill="var(--brand)" fill-opacity=".12"/>':"";
  g+=area.replace('<path ','<path class="fade" ')+'<path class="draw" pathLength="1" d="'+path+'" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach(function(p,i){ var last=i===pts.length-1; g+='<circle class="fade" cx="'+x(p.d)+'" cy="'+y(p.v)+'" r="'+(last?5:3.5)+'" fill="var(--brand)" stroke="var(--bg-raised)" stroke-width="2"/>'+(last?'<text x="'+x(p.d)+'" y="'+(y(p.v)-10)+'" text-anchor="middle" style="fill:var(--ink)">'+p.v+'</text>':''); });
  return '<div class="chart" style="--leader:var(--muted)"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Heard Of Score over time">'+g+'</svg></div>';
}

function llrReport(){
  var rows=S.leaders.rows, you=rows[0], ls=rows.slice(1).filter(function(r){return r.name||r.handle});
  if(!ls.length) return "";
  function n(v){v=parseFloat(v);return isFinite(v)?v:0}
  function avg(k){return ls.reduce(function(a,r){return a+n(r[k])},0)/ls.length}
  var M=[["followers","Followers",0],["posts","Posts in the last 30 days",0],["video","% of posts that are video",0],["reviews","Google reviews",0],["rating","Google rating",1]];
  var gaps=[], bars=M.map(function(m){
    var a=avg(m[0]), y=n(you[m[0]]), max=Math.max(a,y,1)*1.15, gap=y-a;
    if(gap<0) gaps.push({k:m[0],ratio:a?y/a:1});
    return '<div class="bar"><strong>'+m[1]+'</strong><span class="pill '+(gap>=0?"good":"bad")+'">You '+fmt(y,m[2])+' · leaders avg '+fmt(a,m[2])+'</span><span class="track"><span class="rail2"></span><span class="you" style="--w:'+Math.max(y/max*100,1.5)+'%"></span><span class="mk" style="left:calc('+(a/max*100)+'% - 1px)"></span></span></div>';
  }).join("");
  var leadLinks=ls.filter(function(r){return r.link==="guide"}).length;
  if(you.link!=="guide" && leadLinks) gaps.push({k:"link",ratio:0});
  gaps.sort(function(a,b){return a.ratio-b.ratio});
  var FIX={followers:"Boost your best post each week for $35 to a 10-mile radius, and do one collab post a month with a local business.",
    posts:"Get to three posts a week. Your Content Plan already has the next 36 written for "+esc(city())+".",

    rating:"Ask for reviews at the closing table, when the experience is freshest.",
    link:"Swap your link in bio for a free “Moving to "+esc(city())+"” guide. "+leadLinks+" of your 3 leaders already do this."};
  return '<div class="card paper"><div class="row between"><span class="label">Local Leader Report · '+esc(city())+'</span><span class="label">'+new Date().toLocaleDateString()+'</span></div>'+
    '<h2 style="font:800 30px/1.05 var(--sans);letter-spacing:-.035em">'+(gaps.length?'They\'re ahead in '+gaps.length+' of '+(M.length+1)+' areas.':'You\'re keeping up with the leaders.')+'</h2>'+
    '<div class="bars" style="--line:#d9d2c3;--leader:#0b0b0c">'+bars+'</div>'+
    (gaps.length?'<h3>What they do that you don\'t, and the fix</h3><ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px">'+gaps.slice(0,3).map(function(g){return '<li>'+FIX[g.k]+'</li>'}).join("")+'</ol>':'')+

function glide(){
  var wrap=$("navwrap"); if(!wrap) return;
  var on=wrap.querySelector(".nav-item.on");

  var hb=wrap.getBoundingClientRect(), b=on.getBoundingClientRect(); if(!b.width) return;
  var first=!wrap.dataset.placed;
  if(first||calm()) wrap.classList.add("now");
  wrap.style.setProperty("--gx",Math.round(b.left-hb.left)+"px"); wrap.style.setProperty("--gy",Math.round(b.top-hb.top)+"px");
  wrap.style.setProperty("--gw",Math.round(b.width)+"px"); wrap.style.setProperty("--gh",Math.round(b.height)+"px"); wrap.style.setProperty("--go","1");
  wrap.dataset.placed="1";

}

  if(calm()) return;
  document.querySelectorAll("#view [data-count]").forEach(function(el){
    var to=+el.getAttribute("data-count"), t0=performance.now(); el.textContent="0";
    (function f(t){ var k=Math.min(1,(t-t0)/1000), e=1-Math.pow(1-k,3); el.textContent=Math.round(to*e); if(k<1) requestAnimationFrame(f); })(t0);
  });
}
/* A moment when something lands. Decoration only: never blocks the work. */
function celebrate(){
  if(calm()) return;
  try{
    var c=document.createElement("canvas"); c.className="celebrate"; c.setAttribute("aria-hidden","true"); document.body.appendChild(c);
    var W=innerWidth,H=innerHeight,dpr=Math.min(2,window.devicePixelRatio||1); c.width=W*dpr; c.height=H*dpr; c.style.width=W+"px"; c.style.height=H+"px";
    var x=c.getContext("2d"); x.scale(dpr,dpr);
    var cs=getComputedStyle(document.documentElement), cols=["--brand","--brand-2","--watch","--up","--ink"].map(function(k){ return cs.getPropertyValue(k).trim()||"#ff4a2b"; });
    var P=[]; for(var i=0;i<120;i++) P.push({x:W/2+(Math.random()-.5)*200,y:H*.32,vx:(Math.random()-.5)*12,vy:-Math.random()*12-4,r:Math.random()*6,vr:(Math.random()-.5)*.3,w:6+Math.random()*6,h:3+Math.random()*4,c:cols[i%cols.length]});
    var t0=performance.now();
    (function f(t){ var k=(t-t0)/1900; x.clearRect(0,0,W,H);
      P.forEach(function(p){ p.vy+=.34; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; x.save(); x.globalAlpha=Math.max(0,1-k*k); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.w/2,-p.h/2,p.w,p.h); x.restore(); });
      if(k<1) requestAnimationFrame(f); else c.remove(); })(t0);
  }catch(e){}
}
function initials(){ var n=(S.profile&&S.profile.name)||""; var s=n.split(/\s+/).filter(Boolean).map(function(w){return w[0]}).join("").slice(0,2).toUpperCase(); return s||"AA"; }
function avatar(){ return S.photo&&S.photo.indexOf("data:image/")===0 ? '<img src="'+S.photo+'" alt="">' : esc(initials()); }
function greeting(){ var h=new Date().getHours(); return h<12?"Good morning":h<17?"Good afternoon":"Good evening"; }
function meCard(){
  var el=$("meCard"); if(el) el.innerHTML='<span class="av">'+avatar()+'</span><span class="who"><strong>'+esc(S.profile.name||"Your profile")+'</strong><span>'+esc([S.profile.city,S.profile.state].filter(Boolean).join(", ")||"Add your market")+'</span></span>';
  var a=$("tbAv"); if(a) a.innerHTML=avatar();
}
function dayPill(){ var el=$("dayPill"); if(el) el.innerHTML='<i></i>Day '+(S.sample?35:dayOf())+' of 90 · '+phase()[0]; }
function isDark(){ var t=document.documentElement.getAttribute("data-theme"); if(t) return t==="dark"; return !(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches); }
function themeIcon(){ var el=$("themeIcon"); if(el) el.innerHTML=isDark()?'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>':'<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>'; }
try{ var th=localStorage.getItem("ho.theme"); if(th==="light"||th==="dark") document.documentElement.setAttribute("data-theme",th); }catch(e){}
function photoCard(){
  return '<div class="card"><div class="photo"><span class="av">'+avatar()+'</span><div style="display:flex;flex-direction:column;gap:10px;flex:1;min-width:220px"><h3>Your photo</h3><p class="hint">It shows across your dashboard. A clear, friendly headshot works best.</p><div class="row"><label class="btn btn-ghost btn-sm" for="photoIn" style="cursor:pointer">'+(S.photo?"Change photo":"Upload a photo")+'</label>'+(S.photo?'<button class="btn btn-ghost btn-sm" type="button" id="photoRm">Remove</button>':'')+'</div><input type="file" id="photoIn" accept="image/*"></div></div></div>';
}
function setPhoto(file){
  var rd=new FileReader();
  rd.onload=function(){
    var img=new Image();
    img.onload=function(){
      var n=320, c=document.createElement("canvas"); c.width=c.height=n;
      var k=Math.max(n/img.width,n/img.height), w=img.width*k, h=img.height*k;
      c.getContext("2d").drawImage(img,(n-w)/2,(n-h)/2,w,h);
      S.photo=c.toDataURL("image/jpeg",.86); save(); toast("Photo updated"); render();
    };
    img.onerror=function(){ toast("That file isn’t an image we can read"); };
    img.src=rd.result;
  };
  rd.readAsDataURL(file);
}
$("menuBtn").addEventListener("click", function(){ document.body.classList.toggle("menu-open"); });
$("scrim").addEventListener("click", function(){ document.body.classList.remove("menu-open"); });
document.addEventListener("keydown", function(e){ if(e.key==="Escape") document.body.classList.remove("menu-open"); });

document.addEventListener("click", function(e){
  var t=e.target.closest("button,a"); if(!t) return;
  if(t.hasAttribute("data-view")) return go(t.getAttribute("data-view"));
  if(t.id==="themeBtn"){ var nx=isDark()?"light":"dark"; document.documentElement.setAttribute("data-theme",nx); try{ localStorage.setItem("ho.theme",nx); }catch(e){} themeIcon(); return; }
  if(t.id==="photoRm"){ S.photo=""; save(); return render(); }
  if(t.hasAttribute("data-go")) return go(t.getAttribute("data-go"));
  if(t.id==="startOwn"){ S=blank(); save(); return go("setup"); }
  if(t.id==="refreshAudit") return startJob("audit");
  if(t.id==="refreshLeaders") return startJob("leaders");
  if(t.id==="useAutoLeaders"){ S.leaders.source="auto"; applyAuto(); save(); return render(); }
  if(t.id==="signOut"){ api("/api/auth/logout",{method:"POST"}).then(function(){ MODE="login"; view="login"; render(); }); return; }
  if(t.id==="draftBrand"){
    t.disabled=true; t.textContent="Reading your posts…";
    api("/api/brand-draft",{method:"POST"}).then(function(r){
      if(!r.ok){ toast(r.error||"Couldn’t draft it"); t.disabled=false; t.textContent="Draft from my Instagram"; return; }
      var d=r.draft; ["who","where","promise","known","p1","p2","p3","voice","look"].forEach(function(k){ S.anatomy[k]=d[k]; });
      S.anatomy.bios=d.bios; S.anatomy.done=true; save(); progress({brand_anatomy_done:true}); toast("Draft ready. Edit anything."); celebrate(); render();
    }).catch(function(){ toast("Couldn’t draft it"); t.disabled=false; t.textContent="Draft from my Instagram"; });
    return;
  }
  if(t.hasAttribute("data-tab")){ scriptTab=t.getAttribute("data-tab"); return render(); }
  if(t.id==="llrBuild"){ S.leaders.done=true; save(); progress({leaders_done:true}); celebrate(); $("llrOut").innerHTML=llrReport()||'<p class="hint">Add at least one leader to build the report.</p>'; return; }
  if(t.id==="shotsReset"){ S.shots.done={}; save(); return render(); }
  if(t.id==="markConvert"){ S.convert.done=!S.convert.done; save(); if(S.convert.done) celebrate(); return render(); }
  if(t.hasAttribute("data-copy-bio")) return copy(bios()[+t.getAttribute("data-copy-bio")]);
  if(t.hasAttribute("data-copy-post")){ var p=planItems().filter(function(x){return x.key===t.getAttribute("data-copy-post")})[0]; return copy(plainS(p.title)+" ("+p.fmt+"). "+HOOKS[p.day]); }
  if(t.hasAttribute("data-copy-script")){ var s=SCRIPTS[+t.getAttribute("data-copy-script")]; return copy([s.t,"HOOK: "+plainS(s.hook)].concat(s.body.map(function(b,i){return "BEAT "+(i+1)+": "+plainS(b)})).concat(["CLOSE: "+plainS(s.cta)]).join("\n")); }
  if(t.hasAttribute("data-copy-email")){ var em=EMAILS[+t.getAttribute("data-copy-email")]; return copy("Subject: "+plainS(em.s)+"\n\n"+plainS(em.b)); }
  if(t.hasAttribute("data-copy-text")){ var tx=t.closest("div").parentNode.querySelector("p"); return copy(tx.textContent); }
  if(t.id==="copyGuide"){ return copy(Array.prototype.map.call(t.closest(".card").querySelectorAll("li"),function(li,i){return (i+1)+". "+li.textContent}).join("\n")); }
});
document.addEventListener("change", function(e){
  var t=e.target;
  if(t.id==="photoIn"&&t.files&&t.files[0]){ setPhoto(t.files[0]); return; }
  if(t.name && t.closest("#scoreForm")){ draft[t.name]=parseInt(t.value,10); return; }
  if(t.hasAttribute("data-post")){ var k=t.getAttribute("data-post"); if(t.checked) S.plan.done[k]=true; else delete S.plan.done[k]; save(); var c=t.closest(".post"); if(c) c.classList.toggle("done",t.checked); if(view==="plan") render(); return; }
  if(t.hasAttribute("data-shot")){ var i=t.getAttribute("data-shot"); if(t.checked) S.shots.done[i]=true; else delete S.shots.done[i]; save(); return render(); }
  if(t.hasAttribute("data-row")){ S.leaders.rows[+t.getAttribute("data-row")][t.getAttribute("data-k")]=t.value; S.leaders.source="manual"; save(); return; }
});
document.addEventListener("input", function(e){
  var t=e.target;
  if(t.id==="revUrl"){ S.convert.reviewUrl=t.value; save(); clearTimeout(drawQR._t); drawQR._t=setTimeout(drawQR,300); }
  if(t.hasAttribute("data-row")){ S.leaders.rows[+t.getAttribute("data-row")][t.getAttribute("data-k")]=t.value; S.leaders.source="manual"; save(); }

document.addEventListener("submit", function(e){
  e.preventDefault(); var f=e.target;
  if(f.id==="scoreForm"){
    var all=CATS.every(function(c){return c.q.every(function(q){return typeof draft[q[0]]==="number"})});
    if(!all){ $("scoreErr").hidden=false; return; }
    var nextDay=[1,30,60,90].filter(function(d){return !S.scores.some(function(s){return s.day===d})})[0];
    S.scores.push({day:nextDay, date:new Date().toISOString().slice(0,10), answers:draft, auto:!!auditA()}); draft={}; save();
    progress({hos_score:score(S.scores[S.scores.length-1].answers).you, score_day:nextDay}); toast("Score saved"); celebrate(); return go("score");
  }
  if(f.id==="baForm"){
    f.querySelectorAll("[data-ba]").forEach(function(i){ S.anatomy[i.getAttribute("data-ba")]=i.value.trim(); });
    var was=!!S.anatomy.done; S.anatomy.done=!!S.anatomy.who; save(); if(S.anatomy.done&&!was) celebrate(); if(S.anatomy.done) progress({brand_anatomy_done:true}); $("baOut").innerHTML=baOut(); toast("Brand Anatomy saved"); return;
  }
  if(f.id==="loginForm"){
    var em=$("lg-email").value.trim(); if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){ toast("Enter a valid email"); return; }
    api("/api/auth/request",{method:"POST",body:{email:em}}).then(function(){ $("lgOk").hidden=false; });
    return;
  }
  if(f.id==="connectForm"){
    var body={firstName:$("cn-first").value.trim(), lastName:$("cn-last").value.trim(), handle:$("cn-handle").value.trim(), businessName:$("cn-biz").value.trim(), city:$("cn-city").value.trim(), region:$("cn-state").value.trim(), marketSize:$("cn-size").value};
    var btn=$("cnBtn"); btn.disabled=true; btn.textContent="Connecting…";
    api("/api/connect",{method:"POST",body:body}).then(function(r){
      if(!r.ok){ $("cnErr").textContent=r.error||("Something went wrong (error "+r._status+"). Try again in a minute."); $("cnErr").hidden=false; btn.disabled=false; btn.textContent="Connect and analyze"; return; }
      S.profile.name=(body.firstName+" "+body.lastName).trim(); S.profile.handle="@"+body.handle.replace(/^@/,""); S.profile.city=body.city; S.profile.state=body.region; S.profile.marketSize=body.marketSize; S.profile.businessName=body.businessName;
      S.leaders.source="auto";
      JOBS={audit:{id:r.jobs.audit,status:"queued"},leaders:{id:r.jobs.leaders,status:"queued"}};
      go("home"); watchJobs(); loadSpots();
    });
    return;
  }
  if(f.id==="setupForm"){
    var nm=$("su-name").value.trim(), ct=$("su-city").value.trim();
    if(!nm||!ct){ $("suErr").hidden=false; return; }
    S.profile={name:nm, handle:$("su-handle").value.trim(), city:ct, state:$("su-state").value.trim(), marketSize:$("su-size").value};
    S.tier=$("su-tier").value; S.sample=false; save(); return go("home");
  }
});

function boot(){
  var q=new URLSearchParams(location.search), token=q.get("login");
  var verify = token ? api("/api/auth/verify",{method:"POST",body:{token:token}}).then(function(r){ try{ history.replaceState(null,"",location.pathname); }catch(e){} if(!r.ok) loginMsg=r.error||"That login link didn’t work. Ask for a new one."; }) : Promise.resolve();
  verify.then(function(){ return api("/api/me"); }).then(function(me){
    if(me.ok){ MODE="server"; fromServer(me); view=S.profile.handle&&S.profile.city?"home":"setup"; render(); watchJobs(); loadSpots(); return; }
    if(me._status===401){ MODE="login"; view="login"; render(); return; }
    MODE="demo"; view="home"; render();
  }).catch(function(){ MODE="demo"; view="home"; render(); });
}
